name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "Company.Sales.slnx"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Company.Sales.slnx

      - name: Build
        run: dotnet build Company.Sales.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Company.Sales.slnx --configuration Release --no-build --verbosity normal
